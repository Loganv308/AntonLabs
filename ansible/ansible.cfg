[defaults]
host_key_checking = False
private_key_file = /root/.ssh/ansible_ed25519
interpreter_python = auto_silent
vault_password_file = /root/.ansible_vault_pass
inventory = /opt/AntonLabs/ansible/Inventory/
roles_path = /opt/AntonLabs/ansible/roles

[ssh_connection]
ssh_args = -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
