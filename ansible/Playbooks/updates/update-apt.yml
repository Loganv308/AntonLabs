---
- name: Update and upgrade nodes with Graylog integration
  hosts: all
  become: true
  serial: 1

  vars_files:
    - ../../group_vars/all/vault.yml

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Perform full-upgrade
      ansible.builtin.apt:
        upgrade: full
      register: upgrade_result
      failed_when: false

    - name: Remove unused packages
      ansible.builtin.apt:
        autoremove: true

    - name: Clean apt cache
      ansible.builtin.apt:
        autoclean: true

    - name: Send upgrade event to Graylog via GELF
      ansible.builtin.uri:
        url: "http://{{ graylog_server }}:12201/gelf"
        method: POST
        body_format: json
        body:
          version: "1.1"
          host: "{{ inventory_hostname }}"
          short_message: "Node upgrade completed"
          event_type: "node_upgrade"
          changed: "{{ upgrade_result.changed | default(false) | lower }}"
          timestamp: "{{ ansible_date_time.iso8601 }}"
        status_code: [200, 202]
      failed_when: false
