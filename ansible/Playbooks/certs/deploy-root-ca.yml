---
- name: Deploy Antonlabs Root CA
  hosts: all
  become: true

  vars:
    ca_cert_src: "files/antonlabs-rootCA.crt"
    ca_cert_name: "antonlabs-rootCA.crt"

  tasks:
    - name: Copy CA cert (Debian/Ubuntu)
      ansible.builtin.copy:
        src: "{{ ca_cert_src }}"
        dest: "/usr/local/share/ca-certificates/{{ ca_cert_name }}"
        owner: root
        group: root
        mode: "0644"
      when: ansible_os_family == "Debian"
      register: ca_copy_debian

    - name: Update CA trust (Debian/Ubuntu)
      ansible.builtin.command: update-ca-certificates
      when:
        - ansible_os_family == "Debian"
        - ca_copy_debian is changed
      changed_when: true

    - name: Copy CA cert (RHEL)
      ansible.builtin.copy:
        src: "{{ ca_cert_src }}"
        dest: "/etc/pki/ca-trust/source/anchors/{{ ca_cert_name }}"
        owner: root
        group: root
        mode: "0644"
      when: ansible_os_family == "RedHat"
      register: ca_copy_rhel

    - name: Update CA trust (RHEL)
      ansible.builtin.command: update-ca-trust
      when:
        - ansible_os_family == "RedHat"
        - ca_copy_rhel is changed
      changed_when: true
