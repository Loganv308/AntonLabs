---
- name: Deploy CrowdSec to all Linux nodes
  hosts: all
  become: true
  vars:
    crowdsec_whitelist_name: "PromiseLAN"
    crowdsec_whitelist_cidr:
      - "10.10.0.0/24"
    crowdsec_db_path: "/var/lib/crowdsec/data/crowdsec.db"
    crowdsec_enroll_key: "{{ crowdsec_key }}" # Enrollment key from crowdsec portal

  tasks:
    - name: Download CrowdSec repo install script
      ansible.builtin.get_url:
        url: https://install.crowdsec.net
        dest: /tmp/crowdsec-install.sh
        mode: "0700"

    - name: Run CrowdSec repo install script
      ansible.builtin.command: sh /tmp/crowdsec-install.sh
      args:
        creates: /usr/bin/crowdsec

    - name: Ensure crowdsec package is installed
      ansible.builtin.apt:
        name: crowdsec
        state: present

    - name: Deploy CrowdSec config
      ansible.builtin.copy:
        dest: /etc/crowdsec/config.yaml
        owner: root
        group: root
        mode: "0644"
        backup: true # timestamped backup, only when the file actually changes
        content: |
          common:
            daemonize: true
            log_media: file
            log_level: info
            log_dir: /var/log/
            log_max_size: 20
            compress_logs: true
            log_max_files: 10
          config_paths:
            config_dir: /etc/crowdsec/
            data_dir: /var/lib/crowdsec/data/
            simulation_path: /etc/crowdsec/simulation.yaml
            hub_dir: /etc/crowdsec/hub/
            index_path: /etc/crowdsec/hub/.index.json
            notification_dir: /etc/crowdsec/notifications/
            plugin_dir: /usr/local/lib/crowdsec/plugins/
          crowdsec_service:
            #console_context_path: /etc/crowdsec/console/context.yaml
            acquisition_path: /etc/crowdsec/acquis.yaml
            acquisition_dir: /etc/crowdsec/acquis.d
            parser_routines: 1
          cscli:
            output: human
            color: auto
          db_config:
            log_level: info
            type: sqlite
            db_path: /var/lib/crowdsec/data/crowdsec.db
            use_wal: true
            flush:
              max_items: 5000
              max_age: 7d

          plugin_config:
            user: nobody
            group: nogroup

          api:
            client:
              insecure_skip_verify: false
              credentials_path: /etc/crowdsec/local_api_credentials.yaml
            server:
              log_level: info
              listen_uri: 127.0.0.1:8080
              profiles_path: /etc/crowdsec/profiles.yaml
              console_path: /etc/crowdsec/console.yaml
              online_client:
                credentials_path: /etc/crowdsec/online_api_credentials.yaml
              trusted_ips:
                - 127.0.0.1
                - ::1

          prometheus:
            enabled: true
            level: full
            listen_addr: 127.0.0.1
            listen_port: 6060
      notify: Restart crowdsec

    - name: Add whitelist for local LAN
      ansible.builtin.copy:
        dest: "/etc/crowdsec/parsers/s02-enrich/01-my-whitelist.yaml"
        owner: root
        group: root
        mode: "0644"
        content: |
          name: {{ crowdsec_whitelist_name }}
          description: "Whitelist events from my IP range"
          whitelist:
            reason: "My IP range"
            cidr:
            {% for cidr in crowdsec_whitelist_cidr %}
              - "{{ cidr }}"
            {% endfor %}
      notify: Restart crowdsec

    - name: Ensure CrowdSec is enabled and running
      ansible.builtin.systemd:
        name: crowdsec
        state: started
        enabled: true

    - name: Enroll CrowdSec node
      ansible.builtin.command: "cscli console enroll {{ crowdsec_enroll_key }}"
      args:
        creates: /etc/crowdsec/.ansible-enrolled
      register: enroll_output
      changed_when: true
      no_log: true # keeps the enrollment key out of CI logs

    - name: Mark node as enrolled
      ansible.builtin.file:
        path: /etc/crowdsec/.ansible-enrolled
        state: touch
        owner: root
        group: root
        mode: "0600"
        modification_time: preserve
        access_time: preserve
      when: enroll_output is changed

    - name: Show enrollment output
      ansible.builtin.debug:
        var: enroll_output.stdout_lines
      when: enroll_output is changed

  handlers:
    - name: Restart crowdsec
      ansible.builtin.systemd:
        name: crowdsec
        state: restarted
